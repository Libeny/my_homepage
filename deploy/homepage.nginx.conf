# 公网入口复用 Nginx Proxy Manager；站点端口只对本机、Docker 网桥和 Tailscale 开放。
server {
    listen 127.0.0.1:18081;
    listen 172.17.0.1:18081;
    listen 100.80.111.7:18081;
    server_name mupath.xyz www.mupath.xyz;

    root /opt/mupath-homepage/current;
    index index.html;
    autoindex off;
    charset utf-8;
    access_log /var/log/nginx/mupath-homepage.access.log;
    error_log /var/log/nginx/mupath-homepage.error.log;

    add_header X-MuPath-Origin aliyun always;
    add_header X-Content-Type-Options nosniff always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"mupath-homepage"}\n';
    }

    location ~ (^|/)\. {
        return 404;
    }
    location ~* /(?:AGENTS|CLAUDE)\.md$ {
        return 404;
    }
    location ~* \.(?:py|sh|yml|yaml|toml|ini|env|db|sqlite|sqlite3|pem|key|log)(?:$|/) {
        return 404;
    }
    location ^~ /deploy/ { return 404; }
    location ^~ /scripts/ { return 404; }
    location ^~ /docs/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
