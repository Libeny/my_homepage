<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技术随笔 · Writing</title>
  <meta name="description" content="技术随笔——关于 AI、Coding Agent、基建的那些想清楚的事。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Caveat:wght@400;700&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue:#BDE7E5; --blue-deep:#9DD5D3; --blue-soft:#E8F6F5;
      --yellow:#F4CFD6; --yellow-soft:#FCE8EC;
      --red:#694B40; --cream:#FBF2E3; --cream-dark:#F5E6D3;
      --ink:#694B40; --ink-light:#8B6F5C; --ink-faint:#A89488;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', sans-serif;
      background:
        radial-gradient(ellipse at 28% 18%, var(--yellow-soft) 0%, transparent 55%),
        radial-gradient(ellipse at 78% 82%, rgba(189,231,229,0.32) 0%, transparent 55%),
        var(--cream);
      color: var(--ink);
      line-height: 1.7;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 4rem 1.5rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .label {
      font-family: 'Fira Code', monospace;
      font-size: 0.72rem; letter-spacing: 0.18em;
      color: var(--ink-faint); margin-bottom: 1.75rem;
    }
    h1 {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: clamp(2.4rem, 7vw, 4rem);
      line-height: 1.15;
      margin-bottom: 1.5rem;
      max-width: 14ch;
    }
    h1 em {
      font-style: normal;
      background: linear-gradient(to top, var(--yellow) 38%, transparent 38%);
      padding: 0 6px;
    }
    .lede { color: var(--ink-light); max-width: 480px; margin-bottom: 0.6rem; }
    .lede-2 { color: var(--ink-faint); max-width: 480px; font-size: 0.92rem; }
    .note {
      margin-top: 2.5rem;
      font-family: 'Caveat', cursive;
      font-size: 1.25rem;
      color: var(--blue-deep);
    }
    .back {
      margin-top: 3rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.78rem;
      color: var(--red);
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 2px;
      transition: color 0.2s var(--ease-out);
    }
    .back:hover { color: var(--blue-deep); }
  </style>
</head>
<body>
  <span class="label">WRITING · 技术随笔</span>
  <h1>想清楚了，<em>再写</em>。</h1>
  <p class="lede">关于 AI、Coding Agent、基建的那些想清楚的事。</p>
  <p class="lede-2">这一页还会长出来——在那之前，先回主页逛逛。</p>
  <span class="note">还没有内容 ✦ 想到了就写</span>
  <a href="home-v2.html" class="back">← 回主页</a>
</body>
</html>
